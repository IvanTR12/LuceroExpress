<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: transparent;
      width: fit-content;
      height: fit-content;
    }
    .brand-container {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      padding: 16px 24px;
      background: transparent;
    }
    .iso {
      height: 72px;
      width: auto;
      object-fit: contain;
    }
    .logo {
      height: 60px;
      width: auto;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div class="brand-container">
    <img class="iso" src="ISOTIPO.svg" alt="Isotipo">
    <img class="logo" src="LOGOTIPO-white.svg" alt="Logotipo">
  </div>
</body>
</html>
