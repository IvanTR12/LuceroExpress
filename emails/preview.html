<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor de Plantillas de Correo - Lucero Express</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0F0E0D;
      color: #FAFAFA;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    /* Sidebar */
    .sidebar {
      width: 340px;
      min-width: 320px;
      background-color: #181615;
      border-right: 1px solid #292524;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .sidebar-header {
      padding: 22px 20px;
      border-bottom: 1px solid #292524;
      background-color: #141210;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-icon {
      width: 38px;
      height: 38px;
      background: #F2A900;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1C1917;
      font-weight: 900;
      font-size: 20px;
      box-shadow: 0 0 16px rgba(242,169,0,0.3);
    }
    .brand-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #FFFFFF;
    }
    .brand-sub {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #F2A900;
      display: block;
    }
    .sidebar-subtitle {
      font-size: 11px;
      color: #A8A29E;
      margin-top: 10px;
      line-height: 1.4;
    }
    .template-list {
      flex: 1;
      overflow-y: auto;
      padding: 14px 12px;
    }
    .template-item {
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      margin-bottom: 6px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 10px;
      color: #D6D3D1;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.18s ease;
      text-decoration: none;
    }
    .template-item:hover {
      background-color: #292524;
      color: #FFFFFF;
      border-color: #3F3C3A;
    }
    .template-item.active {
      background: #25221F;
      border-color: #F2A900;
      color: #FFFFFF;
      box-shadow: 0 2px 12px rgba(242,169,0,0.12);
    }
    .template-item .item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .item-num {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      background: #36322E;
      color: #F2A900;
      letter-spacing: 0.5px;
    }
    .item-tag {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .item-title {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.35;
    }
    .sidebar-footer {
      padding: 16px;
      border-top: 1px solid #292524;
      background-color: #141210;
      font-size: 11px;
      color: #78716C;
    }
    /* Main Content */
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      background-color: #100F0E;
    }
    .topbar {
      height: 64px;
      background-color: #181615;
      border-bottom: 1px solid #292524;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      gap: 16px;
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .current-title {
      font-size: 14px;
      font-weight: 700;
      color: #FFFFFF;
    }
    .current-file {
      font-size: 12px;
      color: #F2A900;
      font-family: monospace;
      background: #292524;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .viewport-btn-group {
      display: flex;
      background-color: #24211E;
      padding: 3px;
      border-radius: 8px;
      border: 1px solid #36322E;
    }
    .vp-btn {
      background: transparent;
      border: none;
      color: #A8A29E;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }
    .vp-btn:hover {
      color: #FFFFFF;
    }
    .vp-btn.active {
      background: #F2A900;
      color: #1C1917;
      font-weight: 700;
    }
    .action-btn {
      background: #25221F;
      border: 1px solid #36322E;
      color: #FAFAFA;
      font-size: 12px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      font-family: inherit;
      transition: all 0.15s;
    }
    .action-btn:hover {
      border-color: #F2A900;
      color: #F2A900;
      background: #2D2925;
    }
    .action-btn.primary {
      background: #F2A900;
      border-color: #F2A900;
      color: #1C1917;
      font-weight: 700;
    }
    .action-btn.primary:hover {
      background: #D99600;
      color: #1C1917;
    }
    /* Preview Container */
    .preview-stage {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: radial-gradient(circle at 50% 10%, #1A1715 0%, #0F0E0D 100%);
    }
    .iframe-wrapper {
      background: #FFFFFF;
      border-radius: 18px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.6);
      transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
      border: 1px solid #332E2A;
      display: flex;
      flex-direction: column;
    }
    iframe {
      width: 100%;
      height: 820px;
      border: none;
      background: #F5F5F4;
    }
    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #10B981;
      color: #FFFFFF;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      display: none;
      animation: fadeIn 0.2s ease-out;
      z-index: 1000;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Left Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div style="display: inline-flex; align-items: center; gap: 8px; margin-bottom: 12px; background: #FFFFFF; padding: 6px 14px; border-radius: 8px;">
        <img src="https://lucero.com.ve/img/isotipo.png" alt="Lucero Isotipo" style="height: 28px; width: auto; object-fit: contain;">
        <img src="https://lucero.com.ve/img/logotipo.png" alt="Lucero Express" style="height: 24px; width: auto; object-fit: contain;">
      </div>
      <div class="sidebar-subtitle">
        Suite oficial de 9 plantillas de correo HTML para operaciones y cobranzas.
      </div>
    </div>

    <div class="template-list" id="templateList">
      <!-- Items generated by JS -->
    </div>

    <div class="sidebar-footer">
      <div>© Lucero Express &bull; v1.0.0</div>
      <div style="margin-top: 4px; color: #57534E;">Compatible con Gmail, Outlook, Apple Mail y Yahoo.</div>
    </div>
  </aside>

  <!-- Main View Area -->
  <main class="main-area">
    <!-- Topbar -->
    <header class="topbar">
      <div class="topbar-left">
        <span class="current-title" id="currentTitle">01. Bienvenida al Casillero</span>
        <span class="current-file" id="currentFile">01-bienvenida.html</span>
      </div>

      <div class="topbar-actions">
        <!-- Viewport selector -->
        <div class="viewport-btn-group">
          <button class="vp-btn active" onclick="setViewport('desktop', this)">🖥️ Desktop (640px)</button>
          <button class="vp-btn" onclick="setViewport('mobile', this)">📱 Móvil (390px)</button>
          <button class="vp-btn" onclick="setViewport('full', this)">↔️ 100%</button>
        </div>

        <!-- Open Raw -->
        <a id="openNewTabBtn" href="01-bienvenida.html" target="_blank" class="action-btn">
          ↗️ Abrir HTML
        </a>

        <!-- Copy Code -->
        <button onclick="copyCurrentHtml()" class="action-btn primary">
          📋 Copiar Código
        </button>
      </div>
    </header>

    <!-- Preview Stage -->
    <section class="preview-stage">
      <div class="iframe-wrapper" id="iframeWrapper" style="width: 640px;">
        <iframe id="previewFrame" src="01-bienvenida.html"></iframe>
      </div>
    </section>
  </main>

  <div class="toast" id="toast">¡Código HTML copiado al portapapeles!</div>

  <script>
    const templates = [
      {
        id: '01',
        file: '01-bienvenida.html',
        title: 'Bienvenida',
        subtitle: 'Asignación de casillero y bienvenida oficial',
        tag: 'Onboarding',
        tagColor: '#FEF3C7',
        tagTextColor: '#92400E'
      },
      {
        id: '02',
        file: '02-carga-recibida-costo-estimado.html',
        title: 'Carga Recibida en Bodega',
        subtitle: 'Recepción en almacén + Costo estimado ($$$$)',
        tag: 'Almacén',
        tagColor: '#ECFDF5',
        tagTextColor: '#065F46'
      },
      {
        id: '03',
        file: '03-su-carga-ha-zarpado.html',
        title: 'Su Carga ha Zarpado',
        subtitle: 'Despacho formal del buque rumbo a Venezuela',
        tag: 'Zarpe',
        tagColor: '#E0F2FE',
        tagTextColor: '#0369A1'
      },
      {
        id: '04',
        file: '04-su-carga-se-encuentra-navegando.html',
        title: 'Carga Navegando en Altamar',
        subtitle: 'Actualización en ruta marítima / progreso',
        tag: 'Tránsito',
        tagColor: '#E0F2FE',
        tagTextColor: '#0284C7'
      },
      {
        id: '05',
        file: '05-fecha-estimada-llegada.html',
        title: 'Estimación de Llegada (ETA)',
        subtitle: 'Confirmación de ventana de atraque en puerto',
        tag: 'Itinerario',
        tagColor: '#FEF3C7',
        tagTextColor: '#B45309'
      },
      {
        id: '06',
        file: '06-en-aduana-prenotificacion.html',
        title: 'En Aduana (Pre-Notificación)',
        subtitle: 'Ingreso al puerto e inspección aduanal',
        tag: 'Aduana',
        tagColor: '#FFEDD5',
        tagTextColor: '#C2410C'
      },
      {
        id: '07',
        file: '07-notificacion-de-cobro.html',
        title: 'Notificación de Cobro',
        subtitle: 'Factura definitiva y cuentas bancarias',
        tag: 'Cobranza',
        tagColor: '#FEE2E2',
        tagTextColor: '#B91C1C'
      },
      {
        id: '08',
        file: '08-carga-lista-para-retirar.html',
        title: 'Carga Lista para Retirar (Cobro Pendiente)',
        subtitle: 'Llegada a sede + aviso de pago requerido',
        tag: 'Entrega / Retiro',
        tagColor: '#FEE2E2',
        tagTextColor: '#991B1B'
      },
      {
        id: '09',
        file: '09-feedback-calificacion.html',
        title: 'Feedback & Calificación',
        subtitle: 'Encuesta 5 estrellas y cupón de descuento',
        tag: 'Opinión',
        tagColor: '#FEF3C7',
        tagTextColor: '#92400E'
      }
    ];

    let currentTemplate = templates[0];

    function renderList() {
      const container = document.getElementById('templateList');
      container.innerHTML = templates.map((t, idx) => `
        <div class="template-item ${idx === 0 ? 'active' : ''}" onclick="selectTemplate('${t.id}')" id="item-${t.id}">
          <div class="item-top">
            <span class="item-num">${t.id}</span>
            <span class="item-tag" style="background-color: ${t.tagColor}; color: ${t.tagTextColor};">${t.tag}</span>
          </div>
          <div class="item-title">${t.title}</div>
          <div style="font-size: 11px; color: #8C827A; margin-top: 3px;">${t.subtitle}</div>
        </div>
      `).join('');
    }

    function selectTemplate(id) {
      const t = templates.find(item => item.id === id);
      if (!t) return;
      currentTemplate = t;

      document.querySelectorAll('.template-item').forEach(el => el.classList.remove('active'));
      const activeEl = document.getElementById(`item-${id}`);
      if (activeEl) activeEl.classList.add('active');

      document.getElementById('currentTitle').innerText = `${t.id}. ${t.title}`;
      document.getElementById('currentFile').innerText = t.file;
      document.getElementById('openNewTabBtn').href = t.file;
      document.getElementById('previewFrame').src = t.file;
    }

    function setViewport(mode, btn) {
      document.querySelectorAll('.vp-btn').forEach(b => b.classList.remove('active'));
      if (btn) {
        btn.classList.add('active');
      }
      const wrapper = document.getElementById('iframeWrapper');
      
      if (mode === 'desktop') {
        wrapper.style.width = '640px';
      } else if (mode === 'mobile') {
        wrapper.style.width = '390px';
      } else if (mode === 'full') {
        wrapper.style.width = '100%';
      }
    }

    async function copyCurrentHtml() {
      try {
        const response = await fetch(currentTemplate.file);
        const text = await response.text();
        await navigator.clipboard.writeText(text);
        showToast(`¡Código de "${currentTemplate.file}" copiado!`);
      } catch (err) {
        showToast('Abriendo archivo para copiar...');
        window.open(currentTemplate.file, '_blank');
      }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.display = 'block';
      setTimeout(() => {
        t.style.display = 'none';
      }, 3000);
    }

    // Initialize
    renderList();
  </script>
</body>
</html>
